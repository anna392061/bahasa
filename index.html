/* V2: adaptive planning, explanations, and post-session context practice */
.plan-explain{display:flex;align-items:flex-start;gap:9px;margin-top:11px;font-size:12px;line-height:1.65;color:#677f72}
.plan-chip{background:#e7f6ef;color:#267f68;padding:2px 8px;border-radius:8px;white-space:nowrap;font-weight:700}
.adaptive-summary{border-radius:15px;background:#f0faf5;border:1px solid #d9f0e5;padding:14px;margin-top:15px}
.adaptive-summary strong{font-size:15px;color:#1c715a}
.adaptive-summary p{color:#607e70;font-size:12px;line-height:1.65;margin:6px 0 0}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:17px 0 12px}
.mini-stats>div{background:#f7faf8;border-radius:12px;padding:11px 5px;text-align:center}
.mini-stats span,.mini-stats b{display:block}
.mini-stats span{font-size:10px;color:#7a9487;min-height:30px}
.mini-stats b{font-size:14px;margin-top:3px;color:#2d6352}
.context-row{display:flex;justify-content:space-between;align-items:start;gap:12px;border-bottom:1px solid #e9f0ec;padding:15px 0}
.context-row:last-child{border:0}
.context-row b{font-size:17px}
.context-row .sub{font-size:13px;color:#708b7e;margin:4px 0}
.context-row details{font-size:12px;color:#628578;margin-top:7px}
.context-row summary{cursor:pointer;list-style:disclosure-closed;min-height:24px}
.context-row p{line-height:1.7;color:#4e6b61;margin:7px 0}
@media(max-width:360px){.plan-explain{flex-wrap:wrap}.mini-stats b{font-size:12px}.count-select{min-width:80px}}
.sense-badge{display:inline-block;margin:9px 0 3px;padding:4px 9px;border-radius:7px;background:#eaf5f1;color:#316c5f;font-size:12px;font-weight:650}.language-pattern{background:#f1f7fc;border:1px solid #dceaf3;border-radius:13px;padding:12px 14px;margin-top:15px;font-size:13px;line-height:1.72;color:#385873}.pattern-title{font-size:12px;letter-spacing:.2px;font-weight:750;color:#477396;margin-bottom:4px}.sense-footnote{margin-top:9px;font-size:12px;color:#63736e;line-height:1.65;padding:3px 2px}

/* V3.7: meaning-first answer cards, expandable vocabulary, and pronunciation notes */
.meaning-primary{border:1px solid #cdeadd;background:linear-gradient(130deg,#f4fcf8,#f8fffb);border-radius:14px;padding:12px 14px;margin:2px 0 16px}
.priority-label{color:#238767;font-weight:800;font-size:12px;margin:0 0 7px}
.answer .definition{margin:0 0 5px;font-size:20px}
.micro-hint{font-size:11px;color:#728b80;line-height:1.6;margin-top:5px}
.meaning-extra{background:#fbfaf6;border:1px solid #eee9db;padding:12px 14px;border-radius:12px;margin:0 0 15px;line-height:1.5;color:#586454;font-size:13px}
.extra-label{display:block;font-weight:750;color:#a78c56;font-size:11px;margin-bottom:6px}
.meaning-extra strong{font-size:15px;color:#475443}
.meaning-tip,.pron-tip{border-radius:13px;padding:12px 14px;margin-top:12px;font-size:12px;line-height:1.75}
.meaning-tip{background:#f4f7f3;border:1px solid #e4eee5;color:#4b6a59}
.pron-tip{background:#fff9ee;border:1px solid #f5ebd4;color:#765c38}
.meaning-tip b,.pron-tip b{display:block;font-size:12px;margin-bottom:4px}
.pron-tip .audio-inline{margin-top:8px;background:#fcf0d9;color:#8a713e}
.focus-sense{border-radius:999px;background:#eef8f2;color:#4e826d;font-size:12px;padding:6px 12px;margin:-4px 0 13px}
.dictionary-item{align-items:flex-start!important}.dictionary-item>details{flex:1;min-width:0}.dictionary-item>details summary{list-style:none;cursor:pointer;padding:2px 0 3px}.dictionary-item>details summary::-webkit-details-marker{display:none}.dict-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.dict-arrow{font-size:15px;color:#95aa9e}.dictionary-item details[open] .dict-arrow{transform:rotate(180deg)}.dictionary-detail{padding:14px 0 3px}.dictionary-detail .example-label{font-size:12px;color:#63847a;font-weight:700}.dictionary-detail .bilingual{font-size:15px;line-height:1.6;margin:7px 0}.dictionary-detail .translation{font-size:13px;line-height:1.7;color:#698278;margin:6px 0}.dictionary-detail .audio-inline{font-size:12px}

/* V3.8: curated collocations and optional morphology / spoken usage */
.collocation-panel{margin:15px 0 12px;background:#f5faf7;border:1px solid #dcece4;border-radius:15px;padding:14px 14px 5px}
.collocation-heading{font-weight:760;font-size:12px;line-height:1.5;color:#367d68;margin-bottom:12px}
.collocation-row{border-top:1px solid #e3ede7;padding:11px 0 12px;line-height:1.55}
.collocation-row:first-child{border-top:0;padding-top:0}
.collocation-type{display:inline-block;font-size:10px;font-weight:750;color:#709488;background:#e9f2ec;border-radius:999px;padding:2px 7px;margin:0 7px 6px 0}
.collocation-row strong{font-size:14px;color:#29483d;overflow-wrap:anywhere}
.collocation-meaning{display:block;font-size:12px;color:#4f6e63;margin:3px 0 6px}
.collocation-example{font-size:13px;color:#324c42;margin:5px 0 2px}
.collocation-zh{font-size:12px;color:#71877c;margin:0}
.language-fold{background:#fff;border:1px solid #e1e9e4;border-radius:14px;margin:10px 0;overflow:hidden}
.language-fold summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:13px 14px;font-size:12px;font-weight:760;color:#456e5f;cursor:pointer}
.language-fold summary::-webkit-details-marker{display:none}
.language-fold .fold-arrow{color:#91aa9b;font-size:15px;transition:transform .2s}
.language-fold[open] .fold-arrow{transform:rotate(180deg)}
.fold-content{border-top:1px solid #eef1ed;padding:12px 14px 13px;line-height:1.6}
.fold-kicker{font-size:11px;color:#7e9889}
.form-line{font-size:14px;color:#244b3b;font-weight:730;margin:4px 0 6px;overflow-wrap:anywhere}
.fold-content p{font-size:12px;color:#4e695e;margin:5px 0 0}
.fold-content .small-learning-note{color:#85998e;font-size:11px;margin-top:9px}
.casual-example{font-weight:700}

/* Morphology meaning labels */
.morph-gloss-row{display:grid;grid-template-columns:36px minmax(54px,max-content) minmax(0,1fr);gap:8px;align-items:start;border-bottom:1px solid #ecf1ec;padding:9px 0;font-size:12px;line-height:1.5}
.morph-gloss-row span:first-child{color:#82988d;font-size:11px}
.morph-gloss-row b{font-size:13px;color:#2a5946;overflow-wrap:anywhere}
.morph-gloss-row span:last-child{color:#526f61}
.morph-final{font-size:12px;color:#6b8678;margin:4px 0 8px}

/* Verified word families: visible for both a root and its derivatives. */
.family-words{border:1px solid #dbe9e2;background:#f6fbf7;border-radius:14px;padding:13px 14px 11px;margin:12px 0}
.family-words-title{font-size:12px;font-weight:760;color:#427c63;margin-bottom:10px}
.family-words-links{display:flex;flex-wrap:wrap;gap:8px}
.family-word-link{flex:1 1 120px;min-width:0;display:flex;flex-direction:column;text-align:left;align-items:flex-start;gap:3px;border:1px solid #dbeae2;background:white;border-radius:11px;padding:9px 11px;color:#2e5946}
.family-word-link b{font-size:14px}
.family-word-link span{font-size:12px;color:#6e877a}
.family-word-link small{font-size:10px;color:#159572;margin-top:1px}
.family-words p{font-size:11px;color:#819488;margin:10px 0 0;line-height:1.5}

/* Two-way word family quick reference: keeps original study screen and scroll intact. */
.family-reference-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(29,52,40,.48);padding:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.family-reference-sheet{width:min(100%,500px);max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:20px;background:#fcfefc;box-shadow:0 15px 55px rgba(17,41,24,.24);padding:16px 20px 22px;color:#2c483a}
.family-reference-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:4px 0 15px;border-bottom:1px solid #e3ede6}
.family-reference-header small{font-size:10px;letter-spacing:1.1px;font-weight:750;color:#759a88}
.family-reference-header h2{font-size:27px;margin:5px 0 0}
.family-reference-header button{border:1px solid #daece1;border-radius:12px;background:#eef8f2;color:#4d7e65;padding:8px 12px}
.family-reference-body{padding-top:13px}
.family-reference-meaning{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:14px;background:#eef9f2;border-radius:13px;margin-bottom:11px}
.family-reference-meaning b{font-size:19px}
.family-reference-meaning span{color:#6f8779;font-size:12px}
.family-reference-meaning button,.family-reference-example button{border:0;background:#dff3e9;color:#168866;border-radius:9px;padding:7px 10px;margin-left:auto}
.family-reference-example{padding:12px 3px;border-bottom:1px solid #e4eee8}
.family-reference-example b{font-size:11px;color:#6a917d}
.family-reference-example p[lang="id"]{font-size:15px;line-height:1.6;color:#2a4638;margin:12px 0}
.family-reference-example p:not([lang]){font-size:13px;color:#718b7d;line-height:1.6;margin:5px 0 11px}
.family-reference-body>.collocation-panel{margin-top:14px}
.family-reference-disclaimer{font-size:11px;color:#81998b;line-height:1.6;margin-top:16px}

/* V4.0: meaning-first cards; POS is intentionally small and secondary senses are peers. */
.sense-stack{margin:2px 0 16px;border:1px solid #d3e8dd;background:#f6fcf8;border-radius:16px;overflow:hidden}
.sense-block{padding:16px 17px 15px}
.sense-block+.sense-block{border-top:1px solid #dcebe2}
.sense-index{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#729e88;margin:0 0 8px}
.sense-meaning{font-size:22px;font-weight:750;line-height:1.45;color:#254b3b;word-break:break-word}
.sense-pos{font-size:12px;color:#7e9a8b;margin-top:6px}
.sense-collocations{margin-top:16px;padding-top:12px;border-top:1px solid #e0ece4}
.sense-collocations-heading{font-size:11px;font-weight:780;letter-spacing:.3px;color:#5f8a77;margin-bottom:8px}
.sense-collocation{padding:9px 0}
.sense-collocation+.sense-collocation{border-top:1px dashed #e0ebe4}
.sense-collocation-head{display:flex;justify-content:space-between;align-items:center;gap:10px}

ingPriority":"教学优先"},{"learningOrder":"26","learningPhase":"Foundation","id":"w012","word":"ke","pos":"介词","zh":"到；向","example":"Saya mau ke Bali.","exampleZh":"我想去巴厘岛。","usageNote":"","group":"01·基础交流","stage":"1","exampleAdvanced":"Besok pagi saya akan pergi ke pasar untuk membeli buah dan sayuran.","exampleAdvancedZh":"明天早上我会去市场买水果和蔬菜。","pattern":"ke + 目的地：表示“去／向”，如 ke pasar。","primaryMeaning":"到；向","primaryPos":"介词","meaningPriority":"教学优先"},{"learningOrder":"27","learningPhase":"Foundation","id":"w037","word":"pergi","pos":"动词","zh":"去；离开","example":"Saya pergi ke Bali.","exampleZh":"我去巴厘岛。","usageNote":"","group":"03·常用动作","stage":"1","exampleAdvanced":"Setiap akhir pekan saya pergi berjalan-jalan untuk mengenal tempat baru.","exampleAdvancedZh":"每到周末，我都会出去逛逛，认识新的地方。","pattern":"pergi ke + 地点：表示前往；不能漏掉目的地前常用的 ke。","primaryMeaning":"去；离开","primaryPos":"动词","meaningPriority":"教学优先","pronunciationNote":"词中的 e 通常读 /ə/（轻弱元音）。"},{"learningOrder":"28","learningPhase":"Foundation","id":"w050","word":"rumah","pos":"名词","zh":"家；房子","example":"Ini rumah saya.","exampleZh":"这是我家。","usageNote":"","group":"04·生活事物","stage":"1","exampleAdvanced":"Rumah teman saya tidak terlalu besar, tetapi terasa nyaman dan tenang.","exampleAdvancedZh":"我朋友的家不算很大，但让人感到舒适宁静。","primaryMeaning":"家；房子","primaryPos":"名词","meaningPriority":"教学优先"},{"learningOrder":"29","learningPhase":"Foundation","id":"w045","word":"suka","pos":"动词","zh":"喜欢","example":"Saya suka ini.","exampleZh":"我喜欢这个。","usageNote":"","group":"03·常用动作","stage":"1","exampleAdvanced":"Saya suka membaca buku tentang kebudayaan karena selalu menemukan sudut pandang baru.","exampleAdvancedZh":"我喜欢阅读有关文化的书，因为总能发现新的视角。","pattern":"suka + 名词／动词：表示喜欢某物或喜欢做某事。","primaryMeaning":"喜欢","primaryPos":"动词","meaningPriority":"教学优先"},{"learningOrder":"30","learningPhase":"Foundation","id":"w014","word":"dan","pos":"连词","zh":"和","example":"Saya suka makan bersama teman dan keluarga.","exampleZh":"我喜欢和朋友、家人一起吃饭。","usageNote":"","group":"01·基础交流" h":"这不是我的书。","usageNote":"","group":"01·基础交流","stage":"1","exampleAdvanced":"Ini bukan kopi yang saya pesan; saya tadi meminta teh tanpa gula.","exampleAdvancedZh":"这不是我点的咖啡；我刚才要的是不加糖的茶。","pattern":"bukan + 名词／身份：用于否定“是……”。","primaryMeaning":"不是（否定身份／名词）","primaryPos":"副词","meaningPriority":"教学优先","meaningNote":"否定动作和性质通常用 tidak：tidak tahu＝不知道。","collocations":[{"type":"固定结构","phrase":"bukan hanya ... tetapi juga ...","meaning":"不仅……而且……","example":"Ini bukan hanya mudah, tetapi juga berguna.","exampleZh":"这不仅容易，而且有用。","sense":1}]},{"learningOrder":"43","learningPhase":"Foundation","id":"w426","word":"apa kabar","pos":"短语","zh":"你好吗；近况如何","example":"Apa kabar, Rina?","exampleZh":"丽娜，你好吗？","usageNote":"","group":"09·交际与问答","stage":"1","exampleAdvanced":"Apa kabar? Sudah lama kita tidak bertemu sejak acara terakhir itu.","exampleAdvancedZh":"最近怎么样？自上次活动后，我们已经很久没见了。","primaryMeaning":"你好吗；近况如何","primaryPos":"短语","meaningPriority":"教学优先"},{"learningOrder":"44","learningPhase":"Foundation","id":"w649","word":"halo","pos":"感叹词","zh":"你好；喂","example":"Halo, Rina!","exampleZh":"你好，丽娜！","usageNote":"","group":"00·基础交流补充","stage":"1","exampleAdvanced":"Halo, saya baru bergabung dengan kelompok ini dan ingin memperkenalkan diri.","exampleAdvancedZh":"你好，我刚加入这个小组，想介绍一下自己。","primaryMeaning":"你好；喂","primaryPos":"感叹词","meaningPriority":"教学优先"},{"learningOrder":"45","learningPhase":"Foundation","id":"w023","word":"pagi","pos":"名词","zh":"早晨","example":"Saya belajar pagi ini.","exampleZh":"我今天早上学习。","usageNote":"","group":"02·时间与日常","stage":"1","exampleAdvanced":"Pagi ini saya berjalan kaki sebentar sebelum mulai bekerja di rumah.","exampleAdvancedZh":"今天早上我在家开工前步行了一小会儿。","primaryMeaning":"早晨","primaryPos":"名词","meaningPriority":"教学优先"},{"learningOrder":"46","learningPhase":"Foundation","id":"w375","word":"dengan","pos":"介词","zh":"与；用","example":"Saya pergi dengan Rina.","exampleZh":"我和丽娜一起去。","usageNote":"","group":"08·基础句子与连接","stage":"1","exampleAdvanced":"Saya memotong sayuran de 时态。"}},{"learningOrder":"617","learningPhase":"Expression","id":"w518","word":"bahagia","pos":"形容词","zh":"幸福；快乐","example":"Saya bahagia bersama keluarga.","exampleZh":"和家人在一起我很幸福。","usageNote":"","group":"23·情绪与互动","stage":"2","exampleAdvanced":"Saya merasa bahagia ketika bisa menghabiskan waktu sederhana bersama orang-orang yang saya sayangi.","exampleAdvancedZh":"能和爱的人一起度过平凡的时光时，我感到幸福。","primaryMeaning":"幸福；快乐","primaryPos":"形容词","meaningPriority":"教学优先"},{"learningOrder":"618","learningPhase":"Expression","id":"w600","word":"hasil","pos":"名词","zh":"结果；成果","example":"Hasilnya cukup baik.","exampleZh":"结果相当不错。","usageNote":"","group":"25·工作与计划","stage":"2","exampleAdvanced":"Hasil latihan saya mulai terlihat setelah beberapa minggu berlatih secara teratur.","exampleAdvancedZh":"坚持规律练习几个星期后，我的训练效果开始显现。","primaryMeaning":"结果；成果","primaryPos":"名词","meaningPriority":"教学优先"},{"learningOrder":"619","learningPhase":"Expression","id":"w466","word":"awan","pos":"名词","zh":"云","example":"Ada banyak awan di langit.","exampleZh":"天空中有很多云。","usageNote":"","group":"21·自然、天气与环境","stage":"2","exampleAdvanced":"Awan mulai menutupi matahari, tetapi udara masih terasa hangat dan nyaman.","exampleAdvancedZh":"云渐渐遮住太阳，但空气仍然温暖舒适。","primaryMeaning":"云","primaryPos":"名词","meaningPriority":"教学优先"},{"learningOrder":"620","learningPhase":"Expression","id":"w449","word":"merah","pos":"形容词","zh":"红色","example":"Bunga itu berwarna merah.","exampleZh":"那朵花是红色的。","usageNote":"","group":"24·常用颜色和基本概念","stage":"2","exampleAdvanced":"Saya menanam bunga merah di dekat pintu masuk agar halaman terlihat lebih berwarna.","exampleAdvancedZh":"我在门口附近种了红花，让院子看起来更丰富多彩。","primaryMeaning":"红色","primaryPos":"形容词","meaningPriority":"教学优先"},{"learningOrder":"621","learningPhase":"Expression","id":"w513","word":"merasa","pos":"动词","zh":"感觉；感到","example":"Saya merasa lebih baik hari ini.","exampleZh":"我今天感觉好多了。","usageNote":"","group":"29·观点、想法与表达","stage":"2","exampleAdvanced":"Saya merasa lebih percaya diri sete function addDays(key,n){const [y,m,d]=key.split('-').map(Number);const v=new Date(y,m-1,d,12);v.setDate(v.getDate()+n);return dateKey(v);}

function normalizeState(s){

 s.version=VERSION;

 s.settings.timeBudget=clamp(parseInt(s.settings.timeBudget,10)||25,10,60);
 s.settings.adaptive=s.settings.adaptive!==false;
 s.settings.retention=0.90;
 s.settings.rate=clamp(safeNum(Number(s.settings.rate),0.88),0.6,1.2);
 s.settings.autoPlay=s.settings.autoPlay!==false;
 const defaults=newDaily();
 for(const [k,v] of Object.entries(defaults))if(s.daily[k]===undefined)s.daily[k]=v;
 s.daily.queue=Array.isArray(s.daily.queue)?s.daily.queue.filter(x=>ids.has(x.id)):[];
 s.daily.newIds=Array.isArray(s.daily.newIds)?s.daily.newIds.filter(id=>ids.has(id)):[];
 s.daily.dueIds=Array.isArray(s.daily.dueIds)?s.daily.dueIds.filter(id=>ids.has(id)):[];
 s.daily.oldFirstCorrect=clamp(safeNum(Number(s.daily.oldFirstCorrect),0),0,100000);
 s.daily.oldFirstTotal=clamp(safeNum(Number(s.daily.oldFirstTotal),0),0,100000);
 if(s.daily.started && s.daily.planCount===null){s.daily.planCount=s.daily.newIds.length>0 ? s.daily.newIds.length : s.settings.newCount;s.daily.planReason='升级前已开始的学习计划，保持原样';}

 for(const q of (data.daily.queue||[])){if(q.status==='pending'&&['new','carry'].includes(q.mode) && data.cards[q.id] && !data.cards[q.id].graduated){data.cards[q.id].due=dateKey();}}

}}
function recordFinishedDay(){
 const d=data.daily;if(!d.done || !d.doneAt)return;
 data.history[d.date]={date:d.date,seconds:d.seconds,minutes:Math.round(d.seconds/60*10)/10,reviewFirstCorrect:d.oldFirstCorrect,reviewFirstTotal:d.oldFirstTotal,planned:d.planCount,newCount:d.newIds.length,reviewed:d.dueIds.length,deferred:currentDayDeferredCount(),completed:true};
 const keys=Object.keys(data.history).sort();for(const key of keys.slice(0,Math.max(0,keys.length-120)))delete data.history[key];

function previousDays(n=7){const start=addDays(dateKey(),-14);return Object.values(data.history||{}).filter(x=>x && x.completed && x.date<dateKey() && x.date>=start).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);}
function recommendPlan(){
 const base=data.settings.newCount, budget=data.settings.timeBudget;
 if(!data.settings.adaptive)return {count:base,reason:'手动模式：按照设置的每日新词目标学习'};
 const overdue=Object.values(data.cards).filter(c=>c && c.due && c.due<dateKey()).length;
 if(overdue>=25)return {count:0,reason:`已有 ${overdue} 个逾期旧词，今天先复习，不引入新词`};
 if(dueCount()>=60)return {count:0,reason:`今天有 ${dueCount()} 个旧词到期，优先处理复习负担`};
 const recent=previousDays(7),last3=recent.slice(0,3);
 if(last3.length>=2){
  const over=last3.filter(x=>x.minutes>budget+5).length;
  const total=last3.reduce((a,x)=>a+(x.reviewFirstTotal||0),0),correct=last3.reduce((a,x)=>a+(x.reviewFirstCorrect||0),0);
  if(over>=2)return {count:Math.max(5,base-5),reason:`近期完成时间多次超过 ${budget} 分钟，暂时减少5个新词`};
  if(total>=12 && correct/total<0.75)return {count:Math.max(5,base-5),reason:'最近旧词的首次回忆率偏低，暂时减轻新词负担'};
 }
 if(recent.length>=7){
  const total=recent.reduce((a,x)=>a+(x.reviewFirstTotal||0),0),correct=recent.reduce((a,x)=>a+(x.reviewFirstCorrect||0),0);
  const avg=recent.reduce((a,x)=>a+x.minutes,0)/recent.length;
  if(total>=20 && correct/total>=0.85 && avg<=budget && overdue===0 && dueCount()<40){
   return {count:Math.max(base,Math.min(20,base+5)),reason:`最近7个学习日平均 ${avg.toFixed(0)} 分钟、旧词首次回忆率 ${Math.round(correct/total*100)}%，适当增加5个新词`};
  }
 }
 return {count:base,reason:recent.length<7?`观察期：已记录 ${recent.length}/7 个完成日，先保持稳定节奏`:'最近学习节奏稳定，维持当前新词目标'};
}

function reserveNew(){const need=Math.max(0,data.daily.planCount-data.daily.newIds.length);const pool=newAvailable().slice(0,need);

 due.forEach(id=>data.daily.queue.push({id,mode:data.cards[id].graduated?'review':'carry',status:'pending',success:0,miss:0,tries:0,readyAt:0,updated:false}));}

function pending(){return data.daily.queue.filter(q=>q.status==='pending');}
function nextCard(){if(!pending().length){focusId=null;checkQueueDone();save();return null;}
 let qs=pending(); let eligible=qs.filter(q=>q.readyAt<=data.daily.attemptCounter);

function focused(){return data.daily.queue.find(x=>x.id===focusId&&x.status==='pending')||null;}
function fsrsInit(grade){const d=clamp(W[4]-Math.exp(W[5]*(grade-1))+1,1,10);return {stability:W[grade-1],difficulty:d};}
function fsrsReview(card,grade){if(!card.reps){const val=fsrsInit(grade);card.stability=val.stability;card.difficulty=val.difficulty;}
 else{const S=clamp(safeNum(card.stability,1),0.01,36500),D=clamp(safeNum(card.difficulty,5),1,10);
 const previous=card.lastReview ? new Date(card.lastReview+'T12:00:00') : new Date();
 const current=new Date(dateKey()+'T12:00:00');
 const elapsed=Math.max(0,Math.round((current-previous)/86400000));
 const R=Math.pow(1+19*elapsed/(81*S),-0.5);
 const newD=clamp(W[7]*(W[4]-Math.exp(W[5]*3)+1)+(1-W[7])*(D-W[6]*(grade-3)*(10-D)/9),1,10);
 let newS;
 if(elapsed===0){newS=S*Math.exp(W[17]*(grade-3+W[18]));}
 else if(grade===1){newS=Math.min(W[11]*Math.pow(D,-W[12])*(Math.pow(S+1,W[13])-1)*Math.exp(W[14]*(1-R)),S);}
 else{const hard=grade===2?W[15]:1, easy=grade===4?W[16]:1;
 newS=S*(1+Math.exp(W[8])*(11-D)*Math.pow(S,-W[9])*(Math.exp(W[10]*(1-R))-1)*hard*easy);}
 card.stability=clamp(safeNum(newS,S),0.01,36500);card.difficulty=newD;
 }
 card.reps++;if(grade===1)card.lapses++;
 card.lastReview=dateKey();
 const interval=grade===1?1:clamp(Math.round((81/19)*card.stability*(Math.pow(data.settings.retention,-2)-1)),1,36500);
 card.due=addDays(dateKey(),interval);card.graduated=true;
}
function advance(decision){const q=focused();if(!q)return;
 const card=data.cards[q.id];
 // Count only the *first* recall of an old due card: new words are not evidence of long-term retention.
 if(q.mode==='review' && q.tries===0){data.daily.oldFirstTotal++;if(decision==='known')data.daily.oldFirstCorrect++;}
 q.tries++;data.daily.attemptCounter++;data.daily.attempts++;data.totalAttempts++;
 if(decision==='known')q.success++;else{q.success=0;q.miss++;}
 if(q.mode==='review'&&!q.updated){fsrsReview(card,decision==='known'?3:1);q.updated=true;}
 if(['new','carry'].includes(q.mode) && q.success>=2){fsrsReview(card,3);card.due=addDays(dateKey(),1);q.status='done';}
 else if(q.mode==='review' && decision==='known'){q.status='done';}
 else if(q.tries>=MAX_ATTEMPTS || q.miss>=MAX_MISSES){q.status='deferred';if(!card.graduated)fsrsReview(card,1);card.due=addDays(dateKey(),1);}

function collocationLabel(phrase) {

}
function collocationSpeech(item) {
 // A pattern with slots cannot be pronounced literally: play its natural example instead.
 return /^[a-zA-Z]+(?:[ -][a-zA-Z]+)*[?!.]?$/.test(item.phrase) ? item.phrase : (item.example||item.phrase);
}
function collocationsBySense(word,senseIndex) {

  list.map(item=>{

function home(){const d=data.daily, completed=completedDaily(), total=totalDaily(), newDone=currentDayDoneCount('new');

 const plan=d.started?{count:d.planCount,reason:d.planReason}:recommendPlan();const goal=Math.min(plan.count,newAvailable().length+d.newIds.length);
 shell(`<main class="page"><div class="eyebrow">YOUR DAILY SPACE</div><h1>一点一点，记住新的语言。</h1><p class="lead">每天学习印尼语新词，适时复习旧词；用双语例句、固定搭配、词根词缀与日常口语，逐渐建立表达能力。</p>
 <section class="hero"><div class="shape"></div><div class="eyebrow">正在学习 · 词书</div><div class="subject">印尼语基础词汇</div><div class="minor">已接触 ${learntCount()} / ${WORDS.length} 词</div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(learntCount()/WORDS.length*100)}%"></div></div><div class="minor">核心词义 · 固定搭配 · 构词与口语 · 口语主动提取</div></section>
 <div class="stats"><div class="metric"><div class="cap">今日新词</div><div class="num">${newDone}/${d.started?d.newIds.length:goal}</div></div><div class="metric"><div class="cap">今日复习</div><div class="num">${currentDayDoneCount('review')}/${d.started?d.dueIds.length:dueCount()}</div></div><div class="metric"><div class="cap">学习时间</div><div class="num">${Math.floor(d.seconds/60)}<small style="font-size:11px">min</small></div></div></div>
 <div class="block"><div class="block-head"><h2>今日任务</h2><span class="pill">${d.started ? `${progress}% 已完成` : '准备开始'}</span></div><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div><p class="hint">${d.started?`已完成 ${completed} / ${total} 个词的当日任务${currentDayDeferredCount()?`，其中 ${currentDayDeferredCount()} 个困难词安排明日继续`:''}。`:`今天计划引入 ${goal} 个新词，另有 ${dueCount()} 个旧词到期。`}</p>
 <div class="plan-explain"><span class="plan-chip">${data.settings.adaptive?'智能计划':'手动计划'}</span><span>${h(plan.reason)}</span></div>
 <button class="primary" data-action="start" style="margin-top:16px">${d.started&&d.done?'查看今日结果 →':d.started?'继续学习 →':!goal&&!dueCount()?'查看今日状态 →':'开始今天的学习 →'}</button></div>
 <div class="block"><div class="block-head"><h2>每日学习计划</h2><button class="small-link" data-nav="settings">调整 →</button></div><p class="hint">基础目标 ${data.settings.newCount} 词 · 今日安排 ${goal} 词 · 时间预算 ${data.settings.timeBudget} 分钟 · 旧词按90%目标保持率复习</p></div>
 <p class="foot-disclaimer">学习数据保存在当前浏览器中，请定期在「设置」中导出备份。</p></main>`);
}
function study(){
 if(!data.daily.started)prepareSession();
 if(data.daily.done){return donePage();}
 let q=focused();
 if(!q){q=nextCard();if(!q)return donePage();}
 const w=wordMap[q.id],d=data.daily,producing=isProductionCard(q,w);
 const reviewDone=currentDayDoneCount('review'),newDone=currentDayDoneCount('new');
 const desc=producing?'ACTIVE RECALL · 中文 → 日常印尼语':q.mode==='new'?'新词初学 · 先回忆含义':q.mode==='carry'?'上次未完成 · 继续巩固':'到期复习 · 想起含义再选择';
 shell(`<main class="study-content">
 <div class="study-stats"><div><span>今日复习</span><strong>${reviewDone}/${d.dueIds.length}</strong></div><div><span>今日新词</span><strong>${newDone}/${d.newIds.length}</strong></div><div><span>学习时间</span><strong>${Math.floor(d.seconds/60)}<small style="font-size:12px"> min</small></strong></div></div>
 <div class="study-center" style="padding-top:${shownAnswer?'28px':''}">
 <span class="eyebrow">${desc}</span>
 <h1 class="study-word ${producing&&!shownAnswer?'production-prompt':''}" style="margin-top:18px">${h(producing&&!shownAnswer?w.productionPrompt:w.word)}</h1>
 ${producing&&!shownAnswer?'<p class="production-hint">先独立说出自然的印尼语句子，重点回忆这个口语词。不要提前查看答案。</p>':''}
 ${!shownAnswer&&!producing&&w.frontCue?`<span class="focus-sense">本卡语境 · ${h(w.frontCue)}</span>`:""}
 ${shownAnswer?'':producing?'':`<button class="speaker" data-speak="word" aria-label="朗读单词">🔊 <small>播放发音</small></button>`}
 ${shownAnswer?answerCard(w):`<span class="word-meta" style="margin-top:12px">第 ${q.tries+1} 次回忆</span>`}
 </div>
 <div class="bottom-actions">${shownAnswer?`<button class="primary" data-action="next">下一个 →</button>`:`<div class="two-choices"><button class="choice unknown" data-action="unknown">${producing?'没想起来':'不认识'}</button><button class="choice" data-action="known">${producing?'能说出来':'我认识'}</button></div>`}
 ${notice?`<p class="mute-feedback" role="status">${h(notice)}</p>`:''}
 </div></main>`,'study-bg','study');
}
function donePage(){const d=data.daily,deferred=currentDayDeferredCount();
 shell(`<main class="page"><div class="eyebrow">TODAY IS COMPLETE</div><div class="done-card"><div class="success">✓</div><h2>今天的学习完成了</h2><p>今天接触了 ${d.newIds.length} 个新词，复习了 ${d.dueIds.length} 个旧词。<br>${deferred?`其中 ${deferred} 个困难词将于明天继续练习。`:'今天的词都通过了当日学习。'}</p>
 <div class="stats"><div class="metric"><div class="cap">新词通过</div><div class="num">${currentDayDoneCount('new')}</div></div><div class="metric"><div class="cap">复习通过</div><div class="num">${currentDayDoneCount('review')}</div></div><div class="metric"><div class="cap">回忆次数</div><div class="num">${d.attempts}</div></div></div>
 <button class="primary" data-nav="home">返回首页</button><p class="note" style="margin:16px 0 0">认识不代表永久掌握，系统仍会在未来重新测试。</p></div>
 ${d.newIds.length?`<section class="block"><div class="block-head"><h2>用今天的单词说一句话</h2><span class="pill">可选 · 2—3词</span></div><p class="hint">先自己造句，再看看词卡例句。口头练习即可，不增加必做任务。</p>${d.newIds.slice(0,3).map(id=>{const w=wordMap[id];return `<div class="context-row"><div><b>${h(w.word)}</b><div class="sub">${h(w.zh)}</div><details><summary>参考例句</summary><p>${h(w.example)}<br><span class="tiny">${h(w.exampleZh)}</span></p></details></div><button class="audio-inline" data-audio-id="${h(w.id)}" aria-label="朗读${h(w.word)}">🔊</button></div>`}).join('')}</section>`:''}</main>`,'','study');
}
function vocab(){
 shell(`<main class="page"><div class="eyebrow">VOCABULARY</div><h1>基础词书</h1><p class="lead">共 ${WORDS.length} 条词汇与短语。点击词条可查看主学义、固定搭配、构词规律、口语对照与双例句。</p>
 <label for="search-words" class="tiny">查找单词</label><input id="search-words" class="field" placeholder="印尼语 / 中文 / 主题" value="${h(filter)}" autocomplete="off" />
 <div class="block"><div class="block-head"><h2>词汇清单</h2><span class="pill" id="vocab-count"></span></div><div id="vocab-results"></div></div></main>`,'','vocab');
 const results=root.querySelector('#vocab-results');
 const fill=()=>{const query=filter.trim().toLowerCase();const rows=WORDS.filter(w=>w.word.toLowerCase().includes(query)||w.zh.includes(query)||w.group.includes(query)||w.primaryMeaning?.includes(query)||w.secondaryMeaning?.includes(query)||w.thirdMeaning?.includes(query)||w.alternativeForms?.some(x=>x.includes(query))||w.everyday?.form.toLowerCase().includes(query));
 const shown=rows.slice(0,vocabLimit);
 root.querySelector('#vocab-count').textContent=`${rows.length} 个`;
 results.innerHTML=`<ul class="word-list">${shown.map(w=>`<li class="dictionary-item"><details><summary><div class="dict-head"><b>${h(w.word)}</b><span class="dict-arrow">⌄</span></div><div class="sub">先学：${h(w.primaryMeaning||w.zh)}${w.secondaryMeaning?' · 含扩展义':''}${w.standardWordId?' · 日常口语 · 主动提取':''}</div></summary><div class="dictionary-detail" data-card-id="${h(w.id)}">${meaningSummary(w)}<p class="example-label">01 · 基础例句</p><p class="bilingual" lang="id">${h(w.example)}</p><p class="translation">${h(w.exampleZh)}</p><button class="audio-inline" data-audio-id="${h(w.id)}" data-audio-type="example" aria-label="朗读基础例句">🔊 朗读基础句</button><p class="example-label" style="margin-top:15px">02 · 情境例句</p><p class="bilingual" lang="id">${h(w.exampleAdvanced)}</p><p class="translation">${h(w.exampleAdvancedZh)}</p><button class="audio-inline" data-audio-id="${h(w.id)}" data-audio-type="advanced" aria-label="朗读情境例句">🔊 朗读情境句</button>${learningExtras(w)}</div></details><button data-audio-id="${h(w.id)}" aria-label="朗读 ${h(w.word)}">🔊</button></li>`).join('')}</ul>
 ${!rows.length?`<p class="empty">没有找到匹配的词</p>`:''}
 ${rows.length>vocabLimit?`<button class="secondary" style="width:100%" data-action="more-vocab">加载更多（${rows.length-vocabLimit}）</button>`:''}`;};
 root.querySelector('#search-words').addEventListener('input',e=>{filter=e.target.value;vocabLimit=30;fill();});
 results.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;
 if(btn.dataset.audioId){const w=wordMap[btn.dataset.audioId];if(w){const type=btn.dataset.audioType;speak(type==='example'?w.example:type==='advanced'?w.exampleAdvanced:primarySpeech(w));}}
 else if(btn.dataset.speak==='alternate'){const d=btn.closest('[data-card-id]');if(d){const w=wordMap[d.dataset.cardId];if(w)speak(w.exampleAdvanced);}}
 else if(btn.dataset.action==='more-vocab'){vocabLimit+=50;fill();}});
 fill();
}
function settings(){shell(`<main class="page"><div class="eyebrow">PREFERENCES</div><h1>学习设置</h1><p class="lead">按照你的节奏学习。改变新词数量不会清除已经学过的单词。</p>
 <div class="block"><div class="block-head"><h2>每日学习计划</h2><span class="pill">目标保持率 90%</span></div>
 <div class="goal-row"><div><strong>每日新词基础目标</strong><div class="sub">默认10个；可更改为15个等</div></div><input id="goal-count" class="count-select" type="number" min="1" max="40" step="1" value="${data.settings.newCount}" aria-label="每日新词基础目标"></div>
 <div class="goal-row"><div><strong>每日时间预算</strong><div class="sub">建议20—30分钟</div></div><select class="count-select" id="time-budget" aria-label="每日学习时间预算">${[15,20,25,30,40,50,60].map(n=>`<option value="${n}" ${data.settings.timeBudget===n?'selected':''}>${n}分钟</option>`).join('')}</select></div>
 <div class="goal-row"><div><strong>智能调整新词量</strong><div class="sub">根据旧词正确率、学习时间与积压情况安排</div></div><input id="adaptive" class="switch" type="checkbox" ${data.settings.adaptive?'checked':''} aria-label="智能调整新词数量"></div>
 <div class="adaptive-summary"><strong>${data.daily.started?`今日已锁定 ${data.daily.planCount} 个新词`:`今日建议 ${recommendPlan().count} 个新词`}</strong><p>${h(data.daily.started?data.daily.planReason:recommendPlan().reason)}</p></div>
 <p class="hint">前7个有效学习日不主动增加新词；如果复习负担过重仍可能减量。表现稳定可增加5个（智能模式最高20个），复习吃力可减少5个，严重积压时暂停新词。今天开始学习后，修改设置从明天起生效，当前进度不会丢失。</p></div>
 <div class="block"><h2>发音</h2><div class="goal-row"><div><strong>查看答案后自动朗读</strong><div class="sub">使用设备原生印尼语语音</div></div><input id="autoplay" class="switch" type="checkbox" ${data.settings.autoPlay?'checked':''} aria-label="自动朗读"></div>
 <div class="goal-row"><div><strong>朗读速度</strong><div class="sub">${Math.round(data.settings.rate*100)}% · 可调节</div></div><input type="range" id="speak-rate" min="0.6" max="1.2" step="0.05" value="${data.settings.rate}" aria-label="朗读速度" style="width:105px;accent-color:#0eaa88"></div>
 <button class="secondary" data-action="test-voice" style="width:100%;margin-top:15px">🔊 测试印尼语发音</button><p class="hint">${speechVoice?`当前网页语音：${h(speechVoice.name)} (${h(speechVoice.lang)})`:'Safari可能在首次点击发音后才加载可用语音列表。'}</p></div>
 <div class="block"><h2>学习数据</h2><p class="hint">当前已接触 ${learntCount()} 个词。记录保存在本设备浏览器本地，不会自动同步到其他设备。</p><div class="float-row" style="margin-top:14px"><button class="secondary" data-action="export">导出备份</button><button class="secondary" data-action="import">导入备份</button></div><input class="hidden" type="file" id="import-file" accept="application/json,.json"><p class="hint">换手机或清理浏览器数据前，请先导出JSON文件。导入将覆盖当前学习记录。</p></div>
 <div class="block"><div class="block-head"><h2>学习反馈</h2><span class="pill">最近7个完成日</span></div>${(()=>{const days=previousDays();const sec=days.reduce((n,x)=>n+x.seconds,0),all=days.reduce((n,x)=>n+(x.reviewFirstTotal||0),0),ok=days.reduce((n,x)=>n+(x.reviewFirstCorrect||0),0);return `<div class="mini-stats"><div><span>已记录</span><b>${days.length}/7 天</b></div><div><span>平均时间</span><b>${days.length?Math.round(sec/60/days.length):'—'} 分钟</b></div><div><span>旧词首次回忆</span><b>${all?Math.round(ok/all*100)+'%':'—'}</b></div></div>`})()}<p class="hint">准确率仅统计到期旧词的首次回忆，不混入刚开始学习的新词。需积累足够数据后才自动增加学习量。</p></div>
 <div class="block"><div class="block-head"><h2>复习规则</h2><span class="pill">FSRS-5 · 90%</span></div><p class="hint">当天新词需要间隔成功回忆2次；已学旧词采用FSRS-5公开默认参数，并按90%目标回忆率计算下次复习日。忘记的旧词当天再练，最晚次日继续。难词有练习上限以避免无限循环；90%是长期调度目标，不是每天答对率保证。</p></div>
 <p class="note" role="status" id="setting-status">${h(notice)}</p><p class="foot-disclaimer">这是个人学习原型，词义与例句仍建议结合可靠词典校验。</p></main>`,'','settings');
 const goal=root.querySelector('#goal-count');goal.addEventListener('change',()=>{const val=Number(goal.value);if(!Number.isFinite(val)||!Number.isInteger(val)||val<1||val>40){goal.value=data.settings.newCount;notice='每天新词请设置为1—40的整数。';root.querySelector('#setting-status').textContent=notice;return;}data.settings.newCount=val;notice='基础目标已保存；如今日已开始学习，将从明天起生效。';save();settings();});
 root.querySelector('#time-budget').addEventListener('change',e=>{data.settings.timeBudget=Number(e.target.value);notice='时间预算已保存；不会中断今天的学习。';save();settings();});
 root.querySelector('#adaptive').addEventListener('change',e=>{data.settings.adaptive=e.target.checked;notice=`已${e.target.checked?'开启':'关闭'}智能调整；今日已开始的任务不会改变。`;save();settings();});
 root.querySelector('#autoplay').addEventListener('change',e=>{data.settings.autoPlay=e.target.checked;save();});
 root.querySelector('#speak-rate').addEventListener('change',e=>{data.settings.rate=clamp(Number(e.target.value),.6,1.2);save();e.target.closest('.goal-row').querySelector('.sub').textContent=`${Math.round(data.settings.rate*100)}% · 可调节`;});
 root.querySelector('#import-file').addEventListener('change',async(e)=>{const file=e.target.files[0];if(!file)return;
 try{const raw=await file.text();const result=JSON.parse(raw);if(!result||![2,3].includes(result.version)||!result.cards||!result.settings||!result.daily||Array.isArray(result.cards))throw new Error('invalid');
 if(!confirm('导入会覆盖当前设备上的学习记录。确定继续吗？'))return;
 data=normalizeState(result);
 save();focusId=null;shownAnswer=false;notice='备份已恢复。';settings();
 }catch(err){notice='导入失败：请选择从本App导出的JSON备份（格式需匹配）。';settings();}});
}
function exportBackup(){const content=JSON.stringify(data,null,2);const blob=new Blob([content],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`bahasa-backup-${dateKey()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function listeners(){root.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>{const where=btn.dataset.nav;notice='';view=where;shownAnswer=false;selected=null;if(where==='study'&&!data.daily.started)prepareSession();if(where==='study')nextCard();render();}));
 root.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>{
 const act=btn.dataset.action;
 if(act==='start'){prepareSession();view='study';shownAnswer=false;nextCard();render();}
 if(act==='unknown'||act==='known'){selected=act==='known'?'known':'unknown';knownOverride=false;shownAnswer=true;notice='';render();if(data.settings.autoPlay)speak(primarySpeech(wordMap[focusId]),true);}
 if(act==='toggle-known'){knownOverride=!knownOverride;render();}
 if(act==='next'){const d=(selected==='known'&&!knownOverride)||(selected==='unknown'&&knownOverride)?'known':'unknown';advance(d);}
 if(act==='more-vocab'){vocabLimit+=50;vocab();}
 if(act==='test-voice'){speak('Selamat pagi. Saya sedang belajar bahasa Indonesia.');}
 if(act==='export'){exportBackup();}
 if(act==='import'){root.querySelector('#import-file').click();}
 }));
 root.querySelectorAll('[data-speak]').forEach(btn=>btn.addEventListener('click',()=>{const w=wordMap[focusId];if(w){const type=btn.dataset.speak;speak(type==='example'?w.example:type==='advanced'||type==='alternate'?w.exampleAdvanced:primarySpeech(w));}}));
 root.querySelectorAll('[data-audio-id]').forEach(btn=>btn.addEventListener('click',()=>{const w=wordMap[btn.dataset.audioId];if(w)speak(primarySpeech(w));}));
}
function render(){rollover();speechSet();if(view==='home')home();else if(view==='study')study();else if(view==='vocab')vocab();else if(view==='settings')settings();}
// Read-only family-card preview; never changes spaced-repetition state.
let familyPreviewReturnFocus=null, familyPreviewOldOverflow=null;
function showFamilyReference(word){
 const node=document.getElementById('family-reference-overlay');
 if(!node)return;
 node.innerHTML=[
 '<div class="family-reference-sheet" role="dialog" aria-modal="true" aria-label="'+h(word.word)+' 参考词卡">',
 '<header class="family-reference-header"><div><small>WORD FAMILY · 仅供查看</small><h2 lang="id">'+h(word.word)+'</h2></div><button type="button" data-family-close aria-label="返回原词卡">✕</button></header>',
 '<div class="family-reference-body"><button type="button" class="family-reference-quickaudio" data-family-audio="'+h(word.id)+'">🔊 发音</button>'+meaningSummary(word),
 '<section class="family-reference-example"><b>01 · 基础例句</b><p lang="id">'+h(word.example)+'</p><p>'+h(word.exampleZh)+'</p><button type="button" data-family-audio="'+h(word.id)+'" data-family-audio-type="example">🔊 朗读</button></section>',
 '<section class="family-reference-example"><b>02 · 自然情境</b><p lang="id">'+h(word.exampleAdvanced)+'</p><p>'+h(word.exampleAdvancedZh)+'</p><button type="button" data-family-audio="'+h(word.id)+'" data-family-audio-type="advanced">🔊 朗读</button></section>',
 learningExtras(word),
 '',
 '</div></div>'
 ].join('');
 const sheet=node.querySelector('.family-reference-sheet');
 if(sheet)sheet.scrollTop=0;
 const close=node.querySelector('[data-family-close]');
 if(close)close.focus();
}
function openFamilyReference(word){
 let node=document.getElementById('family-reference-overlay');
 if(!node){
  familyPreviewReturnFocus=document.activeElement;
  familyPreviewOldOverflow=document.body.style.overflow;
  document.body.style.overflow='hidden';
  node=document.createElement('div');
  node.id='family-reference-overlay';
  node.className='family-reference-overlay';
  document.body.appendChild(node);
 }
 showFamilyReference(word);
}
function closeFamilyReference(){
 const node=document.getElementById('family-reference-overlay');
 if(node)node.remove();
 if(familyPreviewOldOverflow!==null){
  document.body.style.overflow=familyPreviewOldOverflow;
  familyPreviewOldOverflow=null;
 }
 if(familyPreviewReturnFocus && familyPreviewReturnFocus.isConnected)familyPreviewReturnFocus.focus();
 familyPreviewReturnFocus=null;
}
document.addEventListener('click',event=>{
 const opener=event.target.closest('[data-family-open]');
 if(opener){
  event.preventDefault();
  const target=wordMap[opener.dataset.familyOpen];
  if(target)openFamilyReference(target);
  return;
 }
 const closer=event.target.closest('[data-family-close]');
 if(closer || event.target.id==='family-reference-overlay'){
  closeFamilyReference();return;
 }
 const speaker=event.target.closest('[data-family-audio]');
 if(speaker){
  const target=wordMap[speaker.dataset.familyAudio];
  if(target){
   const type=speaker.dataset.familyAudioType;
   speak(type==='example'?target.example:type==='advanced'?target.exampleAdvanced:primarySpeech(target));
  }
 }
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape' && document.getElementById('family-reference-overlay'))closeFamilyReference();
});

document.addEventListener('click',event=>{
 const btn=event.target.closest('[data-pronounce]');
 if(!btn)return;
 event.preventDefault();
 event.stopPropagation();
 speak(btn.dataset.pronounce);
});
// Count only time in the active study screen. Resume does not count unattended time.
let tickSave=0;
setInterval(()=>{if(view==='study'&&document.visibilityState==='visible' && !data.daily.done){data.daily.seconds++;tickSave++;if(tickSave>=10){save();tickSave=0;} const el=root.querySelector('.study-stats strong:last-child');if(el){const stats=root.querySelectorAll('.study-stats strong');if(stats[2])stats[2].innerHTML=`${Math.floor(data.daily.seconds/60)}<small style="font-size:12px"> min</small>`;}}},1000);
